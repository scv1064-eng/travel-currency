<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f2e6"><meta name="description" content="큰 숫자 버튼으로 바로 계산하는 여행 환율 계산기"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>여행환율</title></head><body><main class="calculator"><header><span class="title">여행환율</span><div class="tools"><button id="refresh" aria-label="환율 새로고침">↻</button><button id="install" aria-label="홈 화면에 추가">＋</button></div></header><section class="display" aria-label="환율 계산"><div class="currency-row"><label class="currency"><span class="sr-only">입력 통화</span><select id="from" aria-label="입력 통화"></select></label><input id="amount" inputmode="none" autocomplete="off" spellcheck="false" aria-label="계산할 금액" value="0" maxlength="16"></div><div class="currency-row converted"><label class="currency"><span class="sr-only">결과 통화</span><select id="to" aria-label="결과 통화"></select></label><output id="result" aria-live="polite">—</output></div><p id="rate"></p></section><div class="meta"><span id="status" role="status">환율 연결 중…</span><span id="saved" class="sr-only"></span></div><section class="keypad" id="keypad" aria-label="숫자 키패드"></section></main><dialog id="guide"><button id="close" aria-label="닫기">×</button><h2>홈 화면에 추가</h2><p>Chrome: 메뉴 ⋮ → 홈 화면에 추가<br>삼성 인터넷: 메뉴 ☰ → 현재 페이지 추가 → 홈 화면</p><p>달러·유로 포함 24개 통화를 지원합니다. 통화를 눌러 변경하세요. ⇅ 버튼으로 서로 바꿀 수 있어요.</p><p>환율은 약 하루마다 갱신됩니다. 수수료 미포함.<br>연결이 없으면 마지막 저장 환율을 사용합니다.</p><a href="https://www.exchangerate-api.com" target="_blank" rel="noreferrer">Rates by ExchangeRate-API</a><button id="done">알겠어요</button></dialog><script src="app.js"></script></body></html>
